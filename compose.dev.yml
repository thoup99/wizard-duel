# Apply on top of docker-compose.yml, only on a trusted development machine.
services:
  app:
    environment:
      DEV_MODE: "true"
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --workers 1 --reload --ws-max-size 65536
