name: pocket-mages
services:
  app:
    build: .
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${PORT:-8000}:8000"
    environment:
      DEV_MODE: ${DEV_MODE:-false}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      MAX_ROOMS: ${MAX_ROOMS:-100}
      GESTURE_CONFIG: /app/backend/config/gestures.json
      SAMPLE_DIR: /app/samples
    volumes:
      - samples:/app/samples
    restart: unless-stopped
    init: true
  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://app:8000
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
volumes:
  samples:
